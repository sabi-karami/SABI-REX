<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#05040a">
<title>SABI-REX</title>
<style>
@font-face{font-family:V;src:url(/rex-fonts/Vazirmatn-Bold.woff2) format("woff2");font-weight:700}
@font-face{font-family:V;src:url(/rex-fonts/Vazirmatn-Regular.woff2) format("woff2");font-weight:400}
:root{--r:#ff2e63;--c:#08d9d6;--g:#ffd166;--bg:#05040a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:#f4f2ff;font-family:V,Tahoma,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
.vig{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.85) 100%);pointer-events:none}
.wrap{position:relative;z-index:2;height:100%;display:grid;place-items:center;text-align:center;padding:24px}
.core{position:relative;width:min(240px,56vw);aspect-ratio:1;margin:0 auto 34px}
.ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid transparent;background:conic-gradient(from 0deg,var(--r),transparent 30%,var(--c) 55%,transparent 80%,var(--r)) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite;filter:drop-shadow(0 0 18px rgba(255,46,99,.55))}
.ring.r2{inset:14%;animation-duration:9s;animation-direction:reverse;opacity:.8}
.ring.r3{inset:28%;animation-duration:4s;opacity:.6}
.hex{position:absolute;inset:36%;display:grid;place-items:center;border-radius:22%;background:radial-gradient(circle at 30% 25%,#ff7a9c,var(--r) 45%,#7a0026);box-shadow:0 0 50px rgba(255,46,99,.7),inset 0 0 18px rgba(255,255,255,.35);animation:beat 2.2s ease-in-out infinite}
.hex svg{width:58%;height:58%}
h1{font-size:clamp(40px,10vw,88px);letter-spacing:.12em;font-weight:700;line-height:1;direction:ltr;background:linear-gradient(90deg,#fff,var(--r) 35%,var(--g) 55%,var(--c) 80%,#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 4s linear infinite;filter:drop-shadow(0 6px 30px rgba(255,46,99,.35))}
h1 span{display:inline-block;opacity:0;transform:translateY(30px) scale(.8);filter:blur(8px);animation:in .9s cubic-bezier(.2,.9,.2,1) forwards}
.sub{margin-top:16px;font-size:13px;letter-spacing:.5em;color:#a9a4c9;direction:ltr;opacity:0;animation:fade 1s 1.1s forwards}
.bar{width:min(320px,70vw);height:3px;margin:34px auto 12px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--r),var(--g));box-shadow:0 0 14px var(--r);animation:load 2.4s .4s cubic-bezier(.6,0,.2,1) forwards}
.st{font-size:12px;color:#8a85ad;min-height:20px;font-family:ui-monospace,Menlo,monospace;direction:ltr}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes sheen{to{background-position:-250% 0}}
@keyframes in{to{opacity:1;transform:none;filter:none}}
@keyframes fade{to{opacity:1}}
@keyframes load{to{width:100%}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="c"></canvas><div class="vig"></div>
<div class="wrap"><div>
 <div class="core"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
  <div class="hex"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10V6l-8-4Z"/><path d="m9 12 2 2 4-4"/></svg></div></div>
 <h1 id="t"></h1><div class="sub">SECURE&nbsp;GATEWAY</div>
 <div class="bar"><i></i></div><div class="st" id="s">handshake…</div>
</div></div>
<script>
(function(){
var w="SABI-REX",h=document.getElementById("t");w.split("").forEach(function(ch,i){var s=document.createElement("span");s.textContent=ch;s.style.animationDelay=(i*.08)+"s";h.appendChild(s)});
var c=document.getElementById("c"),x=c.getContext("2d"),P=[],W,H,dpr=Math.min(2,window.devicePixelRatio||1);
function rs(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr}rs();addEventListener("resize",rs);
var n=Math.min(120,Math.floor(innerWidth*innerHeight/9000));
for(var i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35*dpr,vy:(Math.random()-.5)*.35*dpr,r:(Math.random()*1.6+.4)*dpr,k:Math.random()<.5});
(function f(){x.clearRect(0,0,W,H);for(var i=0;i<P.length;i++){var p=P[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
 for(var j=i+1;j<P.length;j++){var q=P[j],dx=p.x-q.x,dy=p.y-q.y,d=dx*dx+dy*dy,m=140*dpr;if(d<m*m){x.strokeStyle=(p.k?"rgba(255,46,99,":"rgba(8,217,214,")+(1-Math.sqrt(d)/m)*.35+")";x.lineWidth=dpr*.6;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}
 x.fillStyle=p.k?"#ff2e63":"#08d9d6";x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}requestAnimationFrame(f)})();
var S=["handshake…","verifying key…","sealing channel…","access granted ✓"],s=document.getElementById("s"),k=0;
var iv=setInterval(function(){k++;if(k<S.length)s.textContent=S[k];if(k>=S.length-1){clearInterval(iv);setTimeout(function(){location.replace("/dashboard/")},450)}},650);
})();
</script>
</body></html>
